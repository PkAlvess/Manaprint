<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Testeprint</title>
    </head>
    <body>
        <header>
            <h1 class="titulos">MANAPRINT</h1>
        </header>
        <main>
            <div class="container"> 
                <p class="paragrafos">Cole um deck no campo abaixo.</p>
                <textarea id="txtdeck" class="caixa" name="deck" placeholder="digite ou cole sua lista de cartas aqui, depois clique em 'Carregar cartas' para adicioná-las ao seu pedido"></textarea>
                <input class="botao" type="submit" value="Carregar cartas"> 
                
                <!-- Div adicionada para exibir as cartas formatadas -->
                <div id="lista-cartas"></div>
            </div>
        </main>
        <footer></footer>
        <script src="script.js"></script>
    </body>
</html>
